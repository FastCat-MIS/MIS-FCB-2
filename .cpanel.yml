---
deployment:
  tasks:
    - export REPOPATH=/home/fcbdev/api
    - cd $REPOPATH

    - /usr/local/cpanel/3rdparty/bin/git reset --hard HEAD
    - /usr/local/cpanel/3rdparty/bin/git clean -fd
    - echo "🚀 Starting deployment for Laravel project in $REPOPATH"
    - /usr/local/cpanel/3rdparty/bin/git pull origin main

    # Detect PHP binary
    - export PHPBIN=$(which php)
    - echo "Using PHP binary: $PHPBIN"

    # Install dependencies using your own Composer safely
    - $PHPBIN /home/fcbdev/bin/composer.phar install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-sodium

    # Laravel maintenance and caching
    - $PHPBIN artisan down || true
    - $PHPBIN artisan migrate --force || true
    - $PHPBIN artisan optimize:clear
    - $PHPBIN artisan config:cache
    - $PHPBIN artisan route:cache
    - $PHPBIN artisan view:clear
    - $PHPBIN artisan up

    - echo "✅ Deployment completed successfully!"
