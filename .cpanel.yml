---
deployment:
  tasks:
    - export REPOPATH=/home/fcbdev/api
    - cd $REPOPATH

    # Reset repo
    - /usr/local/cpanel/3rdparty/bin/git reset --hard HEAD
    - /usr/local/cpanel/3rdparty/bin/git clean -fd
    - echo "🚀 Starting deployment for Laravel project in $REPOPATH"
    - /usr/local/cpanel/3rdparty/bin/git pull origin main

    # Use PHP 8.2's composer path
    - /opt/cpanel/ea-php82/root/usr/bin/php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - /opt/cpanel/ea-php82/root/usr/bin/php composer-setup.php --install-dir=/home/fcbdev/api --filename=composer
    - /opt/cpanel/ea-php82/root/usr/bin/php -r "unlink('composer-setup.php');"

    # Install dependencies
    - /opt/cpanel/ea-php82/root/usr/bin/php /home/fcbdev/api/composer install --no-interaction --prefer-dist --optimize-autoloader

    # Laravel maintenance and caching
    - /opt/cpanel/ea-php82/root/usr/bin/php artisan down || true
    - /opt/cpanel/ea-php82/root/usr/bin/php artisan migrate --force
    - /opt/cpanel/ea-php82/root/usr/bin/php artisan optimize:clear
    - /opt/cpanel/ea-php82/root/usr/bin/php artisan config:cache
    - /opt/cpanel/ea-php82/root/usr/bin/php artisan route:cache
    - /opt/cpanel/ea-php82/root/usr/bin/php artisan view:clear
    - /opt/cpanel/ea-php82/root/usr/bin/php artisan up

    - echo "✅ Deployment completed successfully!"
