name: 🚀 Deploy Laravel API to cPanel (fastcat-book.dev)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --- 1️⃣ Checkout your Laravel repository ---
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # --- 2️⃣ Install dependencies locally (for build) ---
      - name: ⚙️ Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # --- 3️⃣ (Optional) Create a zip for debug reference ---
      - name: 📁 Prepare deployment package
        run: zip -r deploy.zip . -x "vendor/*" ".git/*" "storage/logs/*"

      # --- 4️⃣ Upload the Laravel API to cPanel via FTP ---
      - name: 🚀 Upload to cPanel (fcbdev@fastcat-book.dev)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: fastcat-book.dev
          username: fcbdev@fastcat-book.dev
          password: ${{ secrets.FTP_PASS }} # <-- Add this in GitHub Secrets
          protocol: ftp
          port: 21
          local-dir: .
          server-dir: /home/fcbdev/api/
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            .env
            deploy.zip

      # --- 5️⃣ Trigger remote deploy-runner.php after upload ---
      - name: 🧩 Run remote artisan commands
        run: |
          curl -sS "https://fastcat-book.dev/api/deploy-runner.php?secret=nP8vX7rQ2wL9eT6zF1kA3yH5uJ0bS4mG"
